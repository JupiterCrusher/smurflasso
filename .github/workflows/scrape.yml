name: Update Crime Data

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:         # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .   # ensures node runs in repo root

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # ensures full history for diff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify scrape.js exists
        run: |
          echo "Checking for scrape.js..."
          ls -lah
          if [ ! -f "scrape.js" ]; then
            echo "❌ scrape.js not found in $(pwd)"
            exit 1
          fi
          echo "✅ scrape.js found"

      - name: Run scrape script
        run: node scrape.js

      - name: Commit and push if data changed
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git diff --quiet || (
            git add public/crime-data.json
            git commit -m "update crime data [skip ci]"
            git push
          )