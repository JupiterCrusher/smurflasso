name: Generate Weekly AI Summary

on:
  schedule:
    - cron: '0 12 * * 0'  # Every Sunday at 12:00 UTC (~6 AM Boise time)
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smurflasso   # same as your scrape job

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate AI Summary
        run: node generate-summary.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit and push if summary changed
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git diff --quiet || (
            git add public/summary.json
            git commit -m "update weekly AI summary [skip ci]"
            git push
          )